# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

version: 4
palette:
  accent: "#00C853"
  text: lightBlue
  textAlt: magenta
  textKubernetes: "#40C4FF"
  textRoot: red
transient_prompt:
  template: "{{ if .Root }}<p:textRoot>\U000F013E</>{{ else }}<p:text>\U000F013E</>{{ end }} "
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: os
        style: plain
        foreground: p:text
        templates:
          - "<p:accent>(</>"
          - "{{ if .WSL }}WSL at {{ end }}{{.Icon}}"
          - "<p:accent>)</>"

      - type: session
        style: plain
        foreground: p:text
        foreground_templates:
          - "{{ if .Root }}p:textRoot{{ end }}"
        templates:
          - "<p:accent>─(</>"
          - "{{ .UserName }}{{ if .SSHSession }} via SSH{{ end }} on {{ .HostName }}"
          - "<p:accent>)</>"

      - type: path
        style: plain
        min_width: 100
        options:
          folder_separator_icon: <#c0c0c0>/</>
          style: full
        foreground: p:textAlt
        templates:
          - "<p:accent>-(</>"
          - "{{ .Path }}"
          - "<p:accent>)</>"

      - type: path
        style: plain
        max_width: 100
        options:
          folder_separator_icon: <#c0c0c0>/</>
          style: agnoster_short
        foreground: p:textAlt
        templates:
          - "<p:accent>-(</>"
          - "{{ .Path }}"
          - "<p:accent>)</>"

  - type: prompt
    alignment: right
    filler: "  "
    segments:
      - type: node
        style: plain
        options:
          fetch_package_manager: true
        foreground: p:text
        templates:
          - <p:accent>(</>
          -  {{ .Full }} / {{ .PackageManagerName }}
          - <p:accent>)-</>

      - type: go
        style: plain
        foreground: p:text
        templates:
          - <p:accent>(</>
          -  {{ .Full }}
          - <p:accent>)-</>

      - foreground: p:text
        type: php
        style: plain
        templates:
          - <p:accent>(</>
          -  {{ .Full }}
          - <p:accent>)-</>

      - type: terraform
        style: plain
        options:
          fetch_version: true
        foreground: p:text
        templates:
          - <p:accent>(</>
          -  {{ .WorkspaceName }}{{ if .Version }} {{ .Version }}{{ end }}
          - <p:accent>)-</>

      - type: helm
        style: plain
        options:
          display_mode: files
        foreground: p:textKubernetes
        templates:
          - <p:accent>(</>
          - "{{ if .Version }}\U000F10FE {{ .Version }}{{ end }}"
          - <p:accent>)-</>
        template: "  {{ .Version }}"

      - type: kubectl
        style: plain
        min_width: 80
        options:
          parse_kubeconfig: true
        foreground: p:textKubernetes
        foreground_templates:
          - '{{ if any (contains "prod" (lower .Context)) (contains "prod" (lower .Cluster)) }}red{{ end }}'
        templates:
          - <p:accent>(</>
          - "{{ if .Context }}\U000F10FE {{ .Context }}{{ end }}"
          - "{{ if .Namespace }} <p:accent>{{.Namespace}}</>{{ end }}"
          - "{{ if .Cluster }} @ {{ .Cluster }}{{ end }}"
          - <p:accent>)-</>

      - type: text
        style: plain
        foreground: p:text
        templates:
          - "{{ if .Env.VSCODE_INJECTION }}<p:accent>(</>VSCode<p:accent>)-</>{{ end }}"

      - type: executiontime
        style: plain
        options:
          threshold: 500
          style: austin
          always_enabled: true
        foreground: p:text
        templates:
          - "<p:accent>(</>"
          - " {{ .FormattedMs }}"
          - "<p:accent>)</>"

      - type: battery
        style: plain
        min_width: 80
        options:
          charged_icon: 
          charging_icon: 
          discharging_icon: 
        foreground: p:text
        foreground_templates:
          - "{{if eq 'Charging' .State.String}}#40c4ff{{end}}"
          - "{{if eq 'Discharging' .State.String}}#ff5722{{end}}"
          - "{{if eq 'Full' .State.String}}#4caf50{{end}}"
        templates:
          - "<p:accent>-(</>"
          - "{{ .Icon }} {{ .Percentage }}"
          - "<p:accent>)</>"

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: git
        style: plain
        options:
          fetch_status: true
          fetch_upstream_icon: true
        foreground: p:text
        templates:
          - <p:accent>(</>
          - "{{ .UpstreamIcon }}{{ .HEAD }}{{ .BranchStatus }}"
          - "{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}"
          - "{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}"
          - "{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}"
          - "{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}"
          - <p:accent>)</>

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: text
        style: plain
        foreground: p:text
        foreground_templates:
          - "{{ if .Root }}p:textRoot{{ end }}"
        template: "\U000F013E "
